<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Shelf</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>🎮 My Game Shelf</h1>
        <p class="subtitle">Save games you like and give them a score.</p>

        <form action="{{ url_for('add_game') }}" method="post" class="card form-card">
            <input name="title" placeholder="Game title" required>
            <input name="genre" placeholder="Genre" required>
            <input name="rating" type="number" min="1" max="10" placeholder="Rating 1-10" required>
            <button type="submit">Add Game</button>
        </form>

        <section class="grid">
            {% for game in games %}
            <article class="card game-card">
                <h2>{{ game.title }}</h2>
                <p>Genre: {{ game.genre }}</p>
                <p class="rating">⭐ {{ game.rating }}/10</p>
                <form action="{{ url_for('delete_game', game_id=game.id) }}" method="post">
                    <button class="danger" type="submit">Delete</button>
                </form>
            </article>
            {% else %}
            <p class="empty">No games yet. Add your first game!</p>
            {% endfor %}
        </section>
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
